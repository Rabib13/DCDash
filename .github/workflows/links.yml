name: Link check

# Job postings close and pages move. This checks every link on the site, on each PR and every Monday.
on:
  pull_request:
    paths: [data/**]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check-links
